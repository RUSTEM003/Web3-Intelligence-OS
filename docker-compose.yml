version: '3.9'

services:
  medtour:
    build: .
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SITE_URL=https://medtour.ai
    volumes:
      - ./public:/app/public
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medtour-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - medtour-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: medtour_root_password
      MYSQL_DATABASE: medtour
      MYSQL_USER: medtour_user
      MYSQL_PASSWORD: medtour_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - medtour-network

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - medtour
    restart: unless-stopped
    networks:
      - medtour-network

volumes:
  redis-data:
  mysql-data:

networks:
  medtour-network:
    driver: bridge
