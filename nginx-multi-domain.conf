map $host $backend_pool {
    default medtour;
    ~^tr\.medtour\.ai$ medtour;
    ~^de\.medtour\.ai$ medtour;
    ~^ru\.medtour\.ai$ medtour;
    ~^ar\.medtour\.ai$ medtour;
    ~^fr\.medtour\.ai$ medtour;
    ~^es\.medtour\.ai$ medtour;
    ~^it\.medtour\.ai$ medtour;
    ~^www\.medtour\.ai$ medtour;
    ~^medtour\.ai$ medtour;
}

map $host $language_code {
    default en;
    ~^tr\.medtour\.ai$ tr;
    ~^de\.medtour\.ai$ de;
    ~^ru\.medtour\.ai$ ru;
    ~^ar\.medtour\.ai$ ar;
    ~^fr\.medtour\.ai$ fr;
    ~^es\.medtour\.ai$ es;
    ~^it\.medtour\.ai$ it;
    ~^(www\.)?medtour\.ai$ en;
}

server {
    listen 80;
    server_name tr.medtour.ai de.medtour.ai ru.medtour.ai ar.medtour.ai fr.medtour.ai es.medtour.ai it.medtour.ai medtour.ai www.medtour.ai;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tr.medtour.ai de.medtour.ai ru.medtour.ai ar.medtour.ai fr.medtour.ai es.medtour.ai it.medtour.ai medtour.ai www.medtour.ai;
    
    ssl_certificate /etc/letsencrypt/live/medtour.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medtour.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' https:; object-src 'none'; frame-src 'self' https:;" always;
    
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    location / {
        proxy_pass http://$backend_pool:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Language-Code $language_code;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location /api/localization/ {
        proxy_pass http://localization:8086/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Language-Code $language_code;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location /api/ {
        proxy_pass http://$backend_pool:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Language-Code $language_code;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location /videos/ {
        alias /var/www/videos/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location = /robots.txt {
        alias /var/www/html/robots.txt;
        access_log off;
    }
    
    location = /sitemap.xml {
        alias /var/www/html/sitemap.xml;
        access_log off;
    }
}
