worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4000;
        
        application live {
            live on;
            
            allow publish all;
            allow play all;
            
            record all;
            record_path /var/recordings;
            record_unique on;
            record_suffix .flv;
            
            hls on;
            hls_path /var/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            
            dash on;
            dash_path /var/dash;
            
            on_publish http://medtour:3000/api/stream/auth;
            on_publish_done http://medtour:3000/api/stream/end;
            
            exec ffmpeg -i rtmp://localhost/live/$name
                -c:v libx264 -c:a aac -b:v 256k -b:a 32k -vf "scale=480:270" -tune zerolatency -preset veryfast -crf 28 -f flv rtmp://localhost/live/$name_low
                -c:v libx264 -c:a aac -b:v 768k -b:a 96k -vf "scale=854:480" -tune zerolatency -preset veryfast -crf 28 -f flv rtmp://localhost/live/$name_mid
                -c:v libx264 -c:a aac -b:v 1024k -b:a 128k -vf "scale=1280:720" -tune zerolatency -preset veryfast -crf 28 -f flv rtmp://localhost/live/$name_high
                -c:v libx264 -c:a aac -b:v 1920k -b:a 128k -vf "scale=1920:1080" -tune zerolatency -preset veryfast -crf 28 -f flv rtmp://localhost/live/$name_source;
        }
        
        application playback {
            live on;
            play /var/recordings;
        }
    }
}

http {
    sendfile off;
    tcp_nopush on;
    directio 512;
    default_type application/octet-stream;
    
    server {
        listen 8080;
        
        location / {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Expose-Headers Content-Length;
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type text/plain charset=UTF-8;
                add_header Content-Length 0;
                return 204;
            }
            
            root /var;
        }
        
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
        }
        
        location /dash {
            root /var;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
        }
        
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /var/www/html;
        }
        
        location /control {
            rtmp_control all;
        }
    }
}
