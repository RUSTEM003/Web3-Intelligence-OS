global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'medtour-backend'
    static_configs:
      - targets: ['medtour:3000']
    metrics_path: '/metrics'

  - job_name: 'gpu-queue'
    static_configs:
      - targets: ['gpu-queue:8080']
    metrics_path: '/metrics'

  - job_name: 'video-translator'
    static_configs:
      - targets: ['video-translator:8081']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
